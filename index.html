<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Little Game</title>

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <main id="game">
        <h1>Little Game</h1>

        <div id="game-world">
            <!-- game board -->
            <div class="yarn-wrapper">
                <div class="yarn-shadow"></div>

                <div class="yarn-ball">
                    <span class="strand strand-1"></span>
                    <span class="strand strand-2"></span>
                    <span class="strand strand-3"></span>
                    <span class="strand strand-4"></span>
                    <span class="strand strand-5"></span>
                </div>

                <div class="thread-tail"></div>
            </div>

        </div>
    </main>

    <script src="assets/js/game.js"></script>
</body>
</html>
