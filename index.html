<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Little Game</title>

    <link rel="icon" type="image/svg+xml" href="./favicon.svg">

    <!-- Google Fonts: Tagesschrift -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Tagesschrift&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- screen 1: entry -->
    <main id="welcome-screen">

        <p class="entry-text">
            In a land far, far away..
        </p>

        <button id="start-button" class="game-button" type="button">
            Start
        </button>

    </main>

    <!-- screen 2: welcome -->
    <main id="game" hidden>

        <h1>Catch Me If You Can</h1>

        <div id="game-world">

            <!-- floating yarn -->
            <div class="yarn-stage">
                <img
                    class="yarn-ball"
                    src="assets/images/yarn-ball-2.svg"
                    alt="Ball of yarn"
                >
            </div>

            <!-- Welcome screen buttons -->
            <div class="welcome-actions">

                <button
                    id="settings-button"
                    class="game-button settings-button"
                    type="button"
                >
                    Settings
                </button>

                <button
                    id="play-button"
                    class="game-button play-button"
                    type="button"
                >
                    Play
                </button>

            </div>

        </div>

        <!-- settings window -->
        <dialog
            id="settings-dialog"
            class="settings-dialog"
            aria-labelledby="settings-title"
        >

            <div class="settings-header">

                <h2 id="settings-title">Settings</h2>

                <button
                    id="close-settings"
                    class="close-settings"
                    type="button"
                    aria-label="Close settings"
                >
                    &times;
                </button>

            </div>

            <div class="settings-content">

                <!-- background music settings -->
                <div class="volume-header">
                    <label for="music-volume">Music</label>
                    <output id="music-volume-value" for="music-volume">
                        35%
                    </output>
                </div>

                <input
                    type="range"
                    id="music-volume"
                    min="0"
                    max="100"
                    value="35"
                    step="1"
                >

                <!-- sound effects volume -->
                <div class="sound-effects-settings">

                    <div class="volume-header">

                        <label for="sound-effects-volume">
                            Sound effects
                        </label>

                        <output
                            id="sound-effects-volume-value"
                            for="sound-effects-volume"
                        >
                            100%
                        </output>

                    </div>

                    <input
                        type="range"
                        id="sound-effects-volume"
                        min="0"
                        max="100"
                        value="100"
                        step="1"
                    >

                </div>

            </div>

        </dialog>

    </main>

    <!-- screen 3: gameplay, three yarn constellation puzzle -->
    <main id="gameplay-screen" hidden>
        <!-- layer 1 static cream background -->
        <div class="gameplay-background" aria-hidden="true"></div>
        <div class="gameplay-content">
            <h2 id="gameplay-heading" class="sr-only" tabindex="-1">Constellation puzzle</h2>

            <div class="puzzle-layout">
                <!-- layer 2 fabric board -->
                <div id="puzzle-board" class="puzzle-board">

                    <!-- 12 point constellation -->
                    <div class="constellation-decoration" aria-hidden="true">

                        <svg
                            class="constellation-lines"
                            viewBox="0 0 100 100"
                            preserveAspectRatio="none"
                        >
                            <path
                                d="
                                    M 28 51
                                    L 18 60
                                    L 23 75
                                    L 37 79
                                    L 47 78
                                    L 55 45
                                    L 64 30
                                    L 70 24
                                    L 77 21
                                    L 88 10

                                    M 77 21
                                    L 89 20

                                    M 77 21
                                    L 85 35
                                "
                            />
                        </svg>

                        <!-- 12 circular points -->
                        <span class="constellation-dot" style="--x:18%; --y:60%"></span>
                        <span class="constellation-dot" style="--x:28%; --y:51%"></span>
                        <span class="constellation-dot" style="--x:23%; --y:75%"></span>
                        <span class="constellation-dot" style="--x:37%; --y:79%"></span>
                        <span class="constellation-dot" style="--x:47%; --y:78%"></span>
                        <span class="constellation-dot" style="--x:55%; --y:45%"></span>
                        <span class="constellation-dot" style="--x:64%; --y:30%"></span>
                        <span class="constellation-dot" style="--x:70%; --y:24%"></span>
                        <span class="constellation-dot" style="--x:77%; --y:21%"></span>
                        <span class="constellation-dot" style="--x:88%; --y:10%"></span>
                        <span class="constellation-dot" style="--x:89%; --y:20%"></span>
                        <span class="constellation-dot" style="--x:85%; --y:35%"></span>

                    </div>

                    <div class="constellation-point" data-target="dark" aria-hidden="true">
                        <span class="target-star">✦</span>
                    </div>
                    <div class="constellation-point" data-target="medium" aria-hidden="true">
                        <span class="target-star">✦</span>
                    </div>
                    <div class="constellation-point" data-target="light" aria-hidden="true">
                        <span class="target-star">✦</span>
                    </div>
                </div>

                <p id="puzzle-status" class="puzzle-status" role="status">
                    Catch and drag...
                </p>

                <!-- win popup -->
                <dialog
                    id="win-dialog"
                    class="win-dialog"
                    aria-labelledby="win-title"
                >

                    <!-- stage 1: win message -->
                    <div id="win-message-view" class="win-dialog-content">

                        <h2 id="win-title">You win!</h2>

                        <p class="win-message">
                            Cool, you've got them
                        </p>

                        <button
                            id="collect-button"
                            class="game-button collect-button"
                            type="button"
                        >
                            Alright
                        </button>

                    </div>

                    <!-- stage 2: birthday reveal -->
                    <div
                        id="birthday-reveal"
                        class="win-dialog-content birthday-reveal"
                        hidden
                    >

                        <h2 id="birthday-title" class="visually-hidden">
                            Happy Birthday
                        </h2>

                        <div class="birthday-image-frame">
                            <img
                                src="assets/images/reveal-text.png"
                                alt="Happy Birthday!"
                                class="birthday-reveal-image"
                            >
                        </div>

                        <button
                            id="back-to-land-button"
                            class="game-button back-to-land-button"
                            type="button"
                        >
                            Back to the faraway land
                        </button>

                    </div>

                </dialog>
              
                <div id="yarn-playfield" class="yarn-playfield">
                    <button class="puzzle-yarn" data-yarn="dark" type="button"
                        aria-label="Dark olive yarn. Drag to its matching star, or press Enter to place.">
                        <img src="assets/images/yarn-ball-olive-dark.svg" alt="" draggable="false">
                    </button>
                    <button class="puzzle-yarn" data-yarn="medium" type="button"
                        aria-label="Medium olive yarn. Drag to its matching star, or press Enter to place.">
                        <img src="assets/images/yarn-ball-olive-mid.svg" alt="" draggable="false">
                    </button>
                    <button class="puzzle-yarn" data-yarn="light" type="button"
                        aria-label="Light olive yarn. Drag to its matching star, or press Enter to place.">
                        <img src="assets/images/yarn-ball-olive-light.svg" alt="" draggable="false">
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- background music -->
    <audio id="background-music" loop preload="auto">
        <source src="assets/audio/background-music.mp3" type="audio/mpeg">
    </audio>

    <script src="assets/js/game.js"></script>
</body>
</html>
