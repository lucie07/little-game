<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Little Game</title>

    <link rel="icon" type="image/svg+xml" href="./favicon.svg">

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- screen 1: entry -->
    <main id="welcome-screen">

        <button id="start-button" class="game-button" type="button">
            Start
        </button>

    </main>

    <!-- screen 2: welcome -->
    <main id="game" hidden>

        <h1>Catch me if you can</h1>

        <div id="game-world">

            <!-- floating yarn -->
            <div class="yarn-stage">
                <img
                    class="yarn-ball"
                    src="assets/images/yarn-ball-2.svg"
                    alt="Ball of yarn"
                >
            </div>

            <!-- Welcome screen buttons -->
            <div class="welcome-actions">

                <button
                    id="settings-button"
                    class="game-button settings-button"
                    type="button"
                >
                    Settings
                </button>

                <button
                    id="play-button"
                    class="game-button play-button"
                    type="button"
                >
                    Play
                </button>

            </div>

        </div>

        <!-- settings window -->
        <dialog
            id="settings-dialog"
            class="settings-dialog"
            aria-labelledby="settings-title"
        >

            <div class="settings-header">

                <h2 id="settings-title">Settings</h2>

                <button
                    id="close-settings"
                    class="close-settings"
                    type="button"
                    aria-label="Close settings"
                >
                    &times;
                </button>

            </div>

            <div class="settings-content">

                <div class="volume-header">
                    <label for="music-volume">Music</label>
                    <output id="music-volume-value" for="music-volume">
                        35%
                    </output>
                </div>

                <input
                    type="range"
                    id="music-volume"
                    min="0"
                    max="100"
                    value="35"
                    step="1"
                >

            </div>

        </dialog>

    </main>

    <!-- screen 3: gameplay -->
    <main id="gameplay-screen" hidden>

        <!-- layer 1 static cream background -->
        <div class="gameplay-background" aria-hidden="true"></div>

        <!-- gameplay content -->
        <div class="gameplay-content">

            <!-- layer 2 puzzle board -->
            <div class="puzzle-board">

            </div>

        </div>

    </main>

    <!-- background music -->
    <audio id="background-music" loop preload="auto">
        <source src="assets/audio/background-music.mp3" type="audio/mpeg">
    </audio>

    <script src="assets/js/game.js"></script>
</body>
</html>
