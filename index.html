<!DOCTYPE html>
<html lang="en">
<head>

    <title>Little Game</title>

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <main id="game">
        <h1>Little Game</h1>

        <div id="game-world">
            <!-- game board -->
        <div class="yarn-stage">
            <svg class="yarn-svg yarn-svg-flat" viewBox="0 0 360 320" aria-label="Flat illustrated yarn ball" role="img">

                    class="yarn-tail"
                    d="M240 72
                    C270 30, 320 28, 338 58
                    C352 82, 343 110, 320 122
                    C293 137, 258 131, 240 110"
                />

                <!-- main yarn body -->
                <ellipse class="yarn-body" cx="155" cy="170" rx="118" ry="112" />

                <!-- yarn bands -->
                <g class="yarn-bands">
                    <!-- top left -->
                    <path d="M56 120 C72 103, 84 87, 100 72" />
                    <path d="M52 154 C70 132, 84 112, 102 92" />
                    <path d="M54 190 C72 165, 89 141, 108 118" />
                    <path d="M63 227 C81 196, 97 167, 118 138" />

                    <!-- left lower -->
                    <path d="M82 252 C94 218, 109 186, 130 154" />
                    <path d="M113 270 C117 230, 129 192, 148 158" />

                    <!-- centre sweeping bands -->
                    <path d="M102 70 C138 77, 180 94, 228 124" />
                    <path d="M104 96 C148 102, 194 122, 246 152" />
                    <path d="M108 124 C155 132, 206 150, 258 180" />
                    <path d="M112 152 C162 160, 212 180, 262 208" />
                    <path d="M120 182 C168 194, 212 213, 250 238" />

                    <!-- right side curved bands -->
                    <path d="M188 120 C220 95, 251 79, 280 69" />
                    <path d="M177 154 C218 126, 252 108, 283 98" />
                    <path d="M170 190 C211 157, 248 135, 282 122" />
                    <path d="M170 226 C205 193, 237 168, 266 142" />

                    <!-- lower wrap area -->
                    <path d="M132 264 C164 242, 194 224, 224 201" />
                    <path d="M170 277 C194 256, 216 239, 237 220" />
                </g>
            </svg>
        </div>

        </div>
    </main>

    <script src="assets/js/game.js"></script>
</body>
</html>
