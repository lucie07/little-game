<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Little Game</title>

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <main id="game">
        <h1>Little Game</h1>

        <div id="game-world">
            <!-- game board -->
        <div class="yarn-stage">
            <svg class="yarn-svg" viewBox="0 0 320 320" aria-label="Cute yarn ball illustration" role="img">

                    <path id="yarnShape"

                            C226 115, 232 133, 229 154

                        <use href="#yarnShape"></use>

                <path
                    class="yarn-tail"
                    d="M210 215
                    C245 225, 260 245, 255 270
                    C250 292, 220 296, 202 286
                    C188 278, 191 258, 208 253
                    C225 248, 242 258, 248 274"
                />

                <!-- base ball -->
                <use href="#yarnShape" class="yarn-base"></use>
                <use href="#yarnShape" class="yarn-outline"></use>

                <path
                    class="yarn-core"
                    d="M132 108
                    C145 94, 171 96, 184 115
                    C194 130, 193 154, 182 178
                    C171 201, 155 215, 144 223
                    C132 212, 121 196, 116 175
                    C111 152, 116 123, 132 108 Z"

                <g clip-path="url(#ballClip)">

                    <g class="wraps wraps-back">

                        <path d="M114 82 C102 126, 104 186, 136 236" />

                    </g>

                    <!-- front wraps -->
                    <g class="wraps wraps-front">
                        <path d="M78 166 C110 135, 162 116, 226 108" />
                        <path d="M76 182 C109 149, 164 130, 230 124" />
                        <path d="M74 198 C110 164, 166 145, 232 141" />
                        <path d="M78 214 C114 179, 169 160, 232 158" />
                        <path d="M88 228 C122 194, 173 176, 230 175" />
                        <path d="M102 238 C133 209, 179 192, 226 190" />
                    </g>

                    <!-- top/side wraps -->
                    <g class="wraps wraps-side">
                        <path d="M92 116 C122 92, 176 87, 214 112" />
                        <path d="M88 134 C120 108, 178 103, 220 128" />
                        <path d="M88 152 C122 125, 181 121, 222 144" />
                    </g>
                    <g class="edge-fibres">
                        <!-- top left -->
                        <path d="M96 101 C89 96, 83 95, 79 100" />
                        <path d="M112 90 C106 84, 99 83, 95 88" />
                        <path d="M130 84 C125 78, 117 77, 112 82" />

                        <!-- top -->
                        <path d="M150 81 C147 73, 155 72, 160 79" />

                        <!-- right -->
                        <path d="M219 110 C228 106, 232 111, 229 118" />
                        <path d="M227 133 C236 132, 238 139, 232 144" />
                        <path d="M228 160 C238 162, 238 169, 231 172" />
                        <path d="M222 188 C230 193, 228 200, 220 201" />

                        <path d="M176 230 C178 239, 170 242, 164 236" />
                        <path d="M147 236 C145 244, 136 244, 134 236" />
                        <path d="M119 232 C115 239, 107 237, 106 229" />

                        <!-- left -->
                        <path d="M92 219 C84 225, 77 221, 80 213" />

                </g>
            </svg>
        </div>

        </div>
    </main>

    <script src="assets/js/game.js"></script>
</body>
</html>
