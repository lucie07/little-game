<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Little Game</title>

    <link rel="icon" type="image/svg+xml" href="./favicon.svg">

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- screen 1: entry -->
    <main id="welcome-screen">

        <button id="start-button" class="game-button" type="button">
            Start
        </button>

    </main>

    <!-- screen 2: welcome -->
    <main id="game" hidden>

        <h1>Little Game</h1>

        <div id="game-world">

            <!-- Floating yarn -->
            <div class="yarn-stage">
                <img
                    class="yarn-ball"
                    src="assets/images/yarn-ball-2.svg"
                    alt="Ball of yarn"
                >
            </div>

            <!-- Play button -->
            <button id="play-button" class="game-button play-button" type="button">
                Play
            </button>

        </div>

    </main>

    <!-- background music -->
    <audio id="background-music" loop preload="auto">
        <source src="assets/audio/background-music.mp3" type="audio/mpeg">
    </audio>

    <script src="assets/js/game.js"></script>
</body>
</html>
